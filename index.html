<!DOCTYPE html>
<html>
<head>
  <!-- Word Wolf Online / https://github.com/higemaru/word-wolf / SPDX-License-Identifier: 0BSD -->
  <base target="_top">
  <title id="page-title">ワードウルフ オンライン</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; color: #333; }
    .card { background: white; padding: 30px; border-radius: 20px; margin: 20px auto; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h1 { color: #1a73e8; margin-bottom: 30px; }
    .btn { padding: 14px 28px; font-size: 16px; cursor: pointer; border-radius: 12px; border: none; background: #1a73e8; color: white; margin: 8px; font-weight: bold; transition: 0.2s; min-width: 120px; }
    .btn:hover { opacity: 0.8; transform: translateY(-1px); }
    .btn-danger { background: #ea4335; }
    .btn-secondary { background: #5f6368; }
    .hidden { display: none !important; }
    #timer { font-size: 4em; font-weight: bold; margin: 10px 0; font-variant-numeric: tabular-nums; }
    .warning { color: #ea4335; animation: blink 0.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    .result-item { text-align: left; border-bottom: 1px solid #eee; padding: 15px; font-size: 1.1em; }
    .wolf-row { background-color: #fce8e6; color: #ea4335; border-radius: 10px; font-weight: bold; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
    #vote-options .btn { display: block; width: 80%; margin: 10px auto; }

    /* 通信中オーバーレイ */
    #loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      backdrop-filter: blur(2px);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1a73e8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* 確認ダイアログ（loading-overlay と同じ構造）*/
    #confirm-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9998;
      backdrop-filter: blur(2px);
    }
    #confirm-dialog {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    #confirm-message {
      font-size: 1.1em;
      margin-bottom: 24px;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- 通信中オーバーレイ -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: #1a73e8;">処理中...</div>
  </div>

  <!-- 確認ダイアログ -->
  <div id="confirm-overlay" class="hidden">
    <div id="confirm-dialog">
      <p id="confirm-message"></p>
      <button class="btn btn-danger" id="confirm-ok">投票する</button>
      <button class="btn btn-secondary" id="confirm-cancel">キャンセル</button>
    </div>
  </div>

  <h1 id="game-title">ワードウルフ オンライン</h1>

  <div id="state-loading" class="card">
    <p>サーバーに接続中...</p>
  </div>

  <div id="state-unauthorized" class="hidden card">
    <h2 style="color: #ea4335;">アクセス権限がありません</h2>
    <p>Players シートにこのアドレスを登録してください：</p>
    <code id="user-email"></code>
  </div>

  <div id="state-waiting" class="hidden card">
    <p>全員が集まるまでお待ちください</p>
    <button class="btn btn-secondary" id="assign-facilitator-btn" onclick="run('assignFacilitator')">進行役をランダムに決める</button>
    <hr>
    <div class="admin-only" style="margin-bottom: 10px;">
      <label for="wolf-count" id="wolf-count-label">人狼の数：</label>
      <select id="wolf-count" style="padding: 5px; border-radius: 5px;">
        <option value="1">1名</option>
        <option value="2">2名</option>
        <option value="3">3名</option>
      </select>
    </div>
    <button class="btn admin-only" onclick="setupWithWolfCount()">お題を配布する</button>
    <p class="user-only" style="color:#666;">進行役が準備しています...</p>
    <hr>
    <button class="btn btn-secondary" onclick="run('resetGame')">🔄 最初からやりなおす</button>
    <button class="btn btn-secondary admin-only"
            style="font-size:12px; padding:6px 12px; min-width:auto;"
            onclick="run('refreshCache')">🛠 キャッシュ再構築</button>
  </div>

  <div id="state-distributing" class="hidden card">
    <div id="word-area">
      <button class="btn" onclick="showWord()">ワードを確認する</button>
    </div>
    <div id="word-display" class="hidden">
      <p id="my-role-notice" style="font-size:1.1em; font-weight:bold;"></p>
      あなたのワードは:<br>
      <h2 id="my-word" style="color: #1a73e8;"></h2>
      <p style="font-size: 0.9em; color:#666;">確認済み人数: <span id="check-count"></span></p>
    </div>
    <hr>
    <button class="btn admin-only" onclick="run('startGame')">ゲーム開始！</button>
  </div>

  <div id="state-started" class="hidden card">
    <div id="timer">00:00</div>
    <p id="time-up-msg" class="hidden" style="color: #ea4335; font-weight: bold;">時間切れ！</p>
    <hr>
    <p>あなたのワード: <b id="my-word-fixed"></b></p>
    <button class="btn admin-only" onclick="run('startVoting')">投票を開始する</button>
  </div>

  <div id="state-voting" class="hidden card">
    <h2>投票タイム！</h2>
    <p id="vote-instruction">人狼だと思う人を選んでください</p>
    <p style="color: #ea4335; font-size: 0.9em; font-weight: bold;">
      ※一度投票すると変更できません
    </p>
    <div id="vote-options"></div>
    <hr>
    <div id="vote-status" style="text-align: left; font-size: 0.9em;">
      <strong>現在の得票数:</strong>
      <div id="vote-tally-list"></div>
    </div>
    <button class="btn btn-danger admin-only" onclick="run('revealAnswer')" style="margin-top:20px;">正解を表示する</button>
  </div>

  <div id="state-revealed" class="hidden card">
    <h2>結果発表</h2>
    <div id="result-list"></div>
    <hr>
    <button class="btn btn-secondary admin-only" onclick="run('resetGame')">次のゲームへ</button>
  </div>

  <audio id="snd-tick" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
  <audio id="snd-alarm" src="https://actions.google.com/sounds/v1/alarms/alarm_clock_short.ogg"></audio>

  <script>
    let targetEndTime = null;
    let currentState  = "";
    let lastSecond    = null;
    let isOperating   = false;

    // ----------------------------------------
    // ホワイトリスト (#2, #3)
    // ----------------------------------------

    // run() から呼び出せる GAS 関数を限定する
    const ALLOWED_FUNCTIONS = new Set([
      'setupWords', 'markAsChecked', 'castVote',
      'startGame', 'startVoting', 'revealAnswer', 'resetGame',
      'assignFacilitator', 'refreshCache'
    ]);

    // 有効なゲームステータスを限定する
    const VALID_STATES = new Set([
      'loading', 'unauthorized', 'waiting',
      'distributing', 'started', 'voting', 'revealed'
    ]);

    // ----------------------------------------
    // XSS 対策ユーティリティ (#1)
    // ----------------------------------------
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ----------------------------------------
    // タイマー
    // ----------------------------------------
    setInterval(() => {
      if (currentState !== 'STARTED' || !targetEndTime) return;
      const now       = new Date().getTime();
      const remaining = Math.max(0, Math.floor((targetEndTime - now) / 1000));
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      const timerEl = document.getElementById('timer');
      if (!timerEl) return;
      timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`; // #4
      if (remaining <= 10 && remaining > 0) {
        timerEl.classList.add('warning');
        if (lastSecond !== remaining) document.getElementById('snd-tick').play().catch(() => {});
      } else if (remaining === 0) {
        timerEl.classList.add('warning');
        document.getElementById('time-up-msg').classList.remove('hidden');
        if (lastSecond > 0) document.getElementById('snd-alarm').play().catch(() => {});
      } else {
        timerEl.classList.remove('warning');
        document.getElementById('time-up-msg').classList.add('hidden');
      }
      lastSecond = remaining;
    }, 1000);

    // ----------------------------------------
    // 通信中オーバーレイ
    // ----------------------------------------
    function setLoading(isLoading) {
      isOperating = isLoading;
      const overlay = document.getElementById('loading-overlay');
      if (isLoading) overlay.classList.remove('hidden');
      else           overlay.classList.add('hidden');
    }

    // ----------------------------------------
    // 確認ダイアログ
    // ----------------------------------------
    function showConfirm(message, onOk) {
      const overlay = document.getElementById('confirm-overlay');
      document.getElementById('confirm-message').textContent = message; // #4
      overlay.classList.remove('hidden');

      document.getElementById('confirm-ok').onclick = () => {
        overlay.classList.add('hidden');
        onOk();
      };
      document.getElementById('confirm-cancel').onclick = () => {
        overlay.classList.add('hidden');
      };
    }

    // ----------------------------------------
    // 状態別描画関数 (#5)
    // ----------------------------------------
    function renderDistributing(data) {
      const area    = document.getElementById('word-area');
      const display = document.getElementById('word-display');
      if (data.isChecked) {
        area.classList.add('hidden');
        display.classList.remove('hidden');

        // 役職表示（wolfKnows が true のときのみ）
        const roleNotice = document.getElementById('my-role-notice');
        if (data.wolfKnows && data.myRole) {
          const isWolf = data.myRole === data.wolfName;
          roleNotice.textContent = `あなたは ${data.myRole} です${isWolf ? '！' : '。'}`;
          roleNotice.style.color = isWolf ? '#ea4335' : '#1a73e8';
        } else {
          roleNotice.textContent = '';
        }
      } else {
        area.classList.remove('hidden');
        display.classList.add('hidden');
      }
    }

    function renderVoting(data) {
      // 投票ボタン
      const optionsEl = document.getElementById('vote-options');
      optionsEl.innerHTML = "";
      data.playerList.forEach(name => {
        const btn = document.createElement('button');
        btn.className   = "btn" + (data.myVote === name ? "" : " btn-secondary");
        btn.textContent = name + (data.myVote === name ? " (投票済み)" : ""); // #4
        btn.disabled    = !!data.myVote;
        btn.onclick     = () => castVote(name);
        optionsEl.appendChild(btn);
      });

      // 得票数（DOM 操作で XSS 回避）(#1)
      const tallyEl = document.getElementById('vote-tally-list');
      tallyEl.innerHTML = "";
      data.playerList.forEach(name => {
        const count = data.voteTallies[name] || 0;
        const div = document.createElement('div');
        div.textContent = `${name}: ${"●".repeat(count)} (${count}票)`; // #4
        tallyEl.appendChild(div);
      });
    }

    function renderRevealed(data) {
      // 結果一覧（DOM 操作で XSS 回避）(#1)
      const listEl = document.getElementById('result-list');
      listEl.innerHTML = "";
      data.allResults.forEach(res => {
        const isWolf = res.role === data.wolfName;

        const div = document.createElement('div');
        div.className = 'result-item' + (isWolf ? ' wolf-row' : '');

        const main = document.createElement('span');
        main.textContent = `[${res.role}] ${res.name} : ${res.word}`; // #4

        const bold = document.createElement('b');
        bold.textContent = res.word; // #4
        // "name : word" の word 部分だけ bold にする
        main.textContent = `[${res.role}] ${res.name} : `;
        main.appendChild(bold);

        const small = document.createElement('small');
        small.textContent = `投票先: ${res.votedFor || '未投票'}`; // #4

        div.appendChild(main);
        div.appendChild(document.createElement('br'));
        div.appendChild(small);
        listEl.appendChild(div);
      });
    }

    // 状態 → 描画関数のマッピング (#5)
    const STATE_RENDERERS = {
      DISTRIBUTING: renderDistributing,
      VOTING:       renderVoting,
      REVEALED:     renderRevealed,
    };

    // ----------------------------------------
    // UI 更新
    // ----------------------------------------
    function updateUI(data) {
      if (!data || !data.status) return;

      if (data.status === 'ERROR') {
        alert("エラーが発生しました: " + data.message);
        return;
      }

      // 有効なステータスかチェック (#3)
      const stateKey = data.status.toLowerCase();
      if (!VALID_STATES.has(stateKey)) {
        console.error("不正なステータス:", data.status);
        return;
      }

      document.querySelectorAll('div[id^="state-"]').forEach(el => el.classList.add('hidden'));

      const stateEl = document.getElementById('state-' + stateKey);
      if (stateEl) stateEl.classList.remove('hidden');
      else         document.getElementById('state-waiting').classList.remove('hidden');

      if (data.status === 'UNAUTHORIZED') {
        document.getElementById('user-email').textContent = data.email; // #4
        return;
      }

      currentState  = data.status;
      targetEndTime = data.endTime;

      document.querySelectorAll('.admin-only').forEach(el => {
        el.style.display = data.isFacilitator ? 'inline-block' : 'none';
      });
      document.querySelectorAll('.user-only').forEach(el => {
        el.style.display = data.isFacilitator ? 'none' : 'block';
      });

      // 抽選ボタン：ファシリテーター未設定なら全員に、設定済みならファシリテーターのみに表示
      const assignBtn = document.getElementById('assign-facilitator-btn');
      if (assignBtn) {
        assignBtn.style.display = (!data.hasFacilitator || data.isFacilitator) ? 'inline-block' : 'none';
      }

      if (data.title) {
        document.getElementById('game-title').textContent = data.title; // #4
        document.getElementById('page-title').textContent = data.title; // #4
      }
      if (data.wolfName) {
        document.getElementById('wolf-count-label').textContent = data.wolfName + 'の数：'; // #4
        document.getElementById('vote-instruction').textContent = data.wolfName + 'だと思う人を選んでください'; // #4
      }

      document.getElementById('my-word').textContent       = data.myWord || "???"; // #4
      document.getElementById('my-word-fixed').textContent = data.myWord || "???"; // #4
      document.getElementById('check-count').textContent   = data.countStr;        // #4

      // 状態別描画 (#5)
      STATE_RENDERERS[data.status]?.(data);
    }

    // ----------------------------------------
    // ポーリング
    // ----------------------------------------
    function poll() {
      if (isOperating) return;
      google.script.run
        .withSuccessHandler(data => { if (!isOperating) updateUI(data); })
        .withFailureHandler(err => console.error("Poll error:", err))
        .getGameState();
    }

    // ----------------------------------------
    // GAS 関数呼び出し（ホワイトリスト制限）(#2)
    // ----------------------------------------
    function run(funcName, ...args) {
      if (!ALLOWED_FUNCTIONS.has(funcName)) {
        console.error("許可されていない関数呼び出し:", funcName);
        return;
      }
      setLoading(true);
      google.script.run
        .withSuccessHandler(data => {
          updateUI(data);
          setTimeout(() => setLoading(false), 300);
        })
        .withFailureHandler(err => {
          console.error("Run error:", err);
          alert("通信エラーが発生しました。");
          setLoading(false);
        })[funcName](...args);
    }

    // ----------------------------------------
    // アクション
    // ----------------------------------------
    function showWord() { run('markAsChecked'); }

    function setupWithWolfCount() {
      const count = document.getElementById('wolf-count').value;
      run('setupWords', parseInt(count));
    }

    function castVote(name) {
      showConfirm(`${name}さんに投票しますか？`, () => run('castVote', name));
    }

    // ----------------------------------------
    // 起動
    // ----------------------------------------
    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
